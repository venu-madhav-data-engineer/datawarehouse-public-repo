name: DuckDB Benchmark & Python CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    name: Python Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pytest ruff

      - name: Lint Python Code with Ruff
        run: ruff check benchmarks/ tests/

      - name: Run DuckDB, Runner Harness & Repository Integrity Tests
        run: pytest -v tests/test_duckdb_benchmark.py tests/test_benchmark_runners.py tests/test_repo_integrity.py

  duckdb-baseline-benchmark:
    name: Execute Multi-Warehouse Benchmark Runner & Publish Summary (Q1-Q5)
    needs: lint-and-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: |
          python -m pip install --upgrade pip
          pip install duckdb

      - name: Run Multi-Warehouse Benchmark Orchestrator & Publish Summary
        run: |
          python benchmarks/runners/run_all_benchmarks.py | tee benchmark_output.txt

          {
            echo "## 📊 Multi-Warehouse OLAP Benchmark Telemetry Report (Q1–Q5)"
            echo ""
            echo "\`\`\`text"
            cat benchmark_output.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
